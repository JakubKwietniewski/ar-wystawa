<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
<a-scene mindar-image="imageTargetSrc: targets.mind;"
         vr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: true">

  <a-assets>
    <!-- KRZESŁO -->
    <img id="krzeslo_willa" src="img/krzeslo_willa.jpg">
    <img id="krzeslo_babcia" src="img/krzeslo_babcia.jpg">
    <img id="krzeslo_kraina" src="img/krzeslo_kraina.jpg">

    <!-- FOTEL -->
    <img id="fotel_willa" src="img/fotel_willa.jpg">
    <img id="fotel_babcia" src="img/fotel_babcia.jpg">
    <img id="fotel_kraina" src="img/fotel_kraina.jpg">

  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- KRZESŁO -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-plane src="#krzeslo_willa" position="-0.7 0 0" width="0.8" height="1.6"></a-plane>
    <a-plane src="#krzeslo_babcia" position="0 0 0" width="0.8" height="1.6"></a-plane>
    <a-plane src="#krzeslo_kraina" position="0.7 0 0" width="0.8" height="1.6"></a-plane>
  </a-entity>

  <!-- FOTEL -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane src="#fotel_willa" position="-0.7 0 0" width="0.8" height="1.6"></a-plane>
    <a-plane src="#fotel_babcia" position="0 0 0" width="0.8" height="1.6"></a-plane>
    <a-plane src="#fotel_kraina" position="0.7 0 0" width="0.8" height="1.6"></a-plane>
  </a-entity>

</a-scene>
</body>
</html>
