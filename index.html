<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
<a-scene mindar-image="imageTargetSrc: targets.mind;"
         vr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: true"
         cursor="rayOrigin: mouse">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- ======================= KRZESŁO ======================= -->
  <a-assets>
    <img id="k1" src="img/krzeslo_willa.jpg">
    <img id="k2" src="img/krzeslo_babcia.jpg">
    <img id="k3" src="img/krzeslo_kraina.jpg">

    <img id="c1" src="img/kredens_willa.jpg">
    <img id="c2" src="img/kredens_babcia.jpg">
    <img id="c3" src="img/kredens_kraina.jpg">

    <img id="s1" src="img/stol_willa.jpg">
    <img id="s2" src="img/stol_babcia.jpg">
    <img id="s3" src="img/stol_kraina.jpg">

    <img id="l1" src="img/lampa_willa.jpg">
    <img id="l2" src="img/lampa_babcia.jpg">
    <img id="l3" src="img/lampa_kraina.jpg">

    <img id="sz1" src="img/szafa_willa.jpg">
    <img id="sz2" src="img/szafa_babcia.jpg">
    <img id="sz3" src="img/szafa_kraina.jpg">

    <img id="b1" src="img/biurko_willa.jpg">
    <img id="b2" src="img/biurko_babcia.jpg">
    <img id="b3" src="img/biurko_kraina.jpg">
  </a-assets>

  <a-camera></a-camera>

  <!-- ======================= 0 KRZESŁO ======================= -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane class="layer" src="#k1" opacity="1" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#k2" opacity="0" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#k3" opacity="0" width="1" height="1"></a-plane>
    <a-circle class="btn" radius="0.1" position="0 -0.7 0" color="#00AEEF"></a-circle>
  </a-entity>

  <!-- ======================= 1 KREDENS ======================= -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-plane class="layer" src="#c1" opacity="1" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#c2" opacity="0" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#c3" opacity="0" width="1" height="1"></a-plane>
    <a-circle class="btn" radius="0.1" position="0 -0.7 0" color="#00AEEF"></a-circle>
  </a-entity>

  <!-- ======================= 2 STÓŁ ======================= -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-plane class="layer" src="#s1" opacity="1" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#s2" opacity="0" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#s3" opacity="0" width="1" height="1"></a-plane>
    <a-circle class="btn" radius="0.1" position="0 -0.7 0" color="#00AEEF"></a-circle>
  </a-entity>

  <!-- ======================= 3 LAMPA ======================= -->
  <a-entity mindar-image-target="targetIndex: 3">
    <a-plane class="layer" src="#l1" opacity="1" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#l2" opacity="0" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#l3" opacity="0" width="1" height="1"></a-plane>
    <a-circle class="btn" radius="0.1" position="0 -0.7 0" color="#00AEEF"></a-circle>
  </a-entity>

  <!-- ======================= 4 SZAFA ======================= -->
  <a-entity mindar-image-target="targetIndex: 4">
    <a-plane class="layer" src="#sz1" opacity="1" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#sz2" opacity="0" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#sz3" opacity="0" width="1" height="1"></a-plane>
    <a-circle class="btn" radius="0.1" position="0 -0.7 0" color="#00AEEF"></a-circle>
  </a-entity>

  <!-- ======================= 5 BIURKO ======================= -->
  <a-entity mindar-image-target="targetIndex: 5">
    <a-plane class="layer" src="#b1" opacity="1" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#b2" opacity="0" width="1" height="1"></a-plane>
    <a-plane class="layer" src="#b3" opacity="0" width="1" height="1"></a-plane>
    <a-circle class="btn" radius="0.1" position="0 -0.7 0" color="#00AEEF"></a-circle>
  </a-entity>

</a-scene>

<script>
let states = [0,0,0,0,0,0];

document.querySelectorAll(".btn").forEach((btn, index) => {
  btn.addEventListener("click", () => {

    const entity = btn.parentNode;
    const layers = entity.querySelectorAll(".layer");

    states[index] = (states[index] + 1) % 3;

    layers.forEach(l => l.setAttribute("opacity", 0));

    fade(layers[states[index]]);
  });
});

function fade(el) {
  let o = 0;
  const i = setInterval(() => {
    o += 0.05;
    el.setAttribute("opacity", o);
    if (o >= 1) clearInterval(i);
  }, 20);
}
</script>

</body>
</html>
