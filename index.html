<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Deklaracja Twoich oryginalnych nazw plików (bez polskich znaków dla bezpieczeństwa) -->
      <a-assets>
        <img id="blat_kraina" src="blat_kraina.jpg">
        <img id="blat_willa" src="blat_willa.jpg">
        <img id="fotel_babcia" src="fotel_babcia.jpg">
        <img id="fotel_kraina" src="fotel_kraina.jpg">
        <img id="kredens_kraina" src="kredens_kraina.jpg">
        <img id="kredens_willa" src="kredens_willa.jpg">
        <img id="krzeslo_babcia" src="krzeslo_babcia.jpg">
        <img id="krzeslo_willa" src="krzeslo_willa.jpg">
        <img id="lampa_babcia" src="lampa_babcia.jpg">
        <img id="lampa_willa" src="lampa_willa.jpg">
        <img id="stol_babcia" src="stol_babcia.jpg">
        <img id="stol_kraina" src="stol_kraina.jpg">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ========================================================== -->
      <!-- 1. BLAT (targetIndex: 0)                                   -->
      <!-- Wyświetla: blat_kraina po lewej, blat_willa po prawej      -->
      <!-- ========================================================== -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#blat_kraina" position="-1.2 0 -0.1" height="1" width="1"></a-plane>
        <a-plane src="#blat_willa" position="1.2 0 -0.1" height="1" width="1"></a-plane>
      </a-entity>

      <!-- ========================================================== -->
      <!-- 2. FOTEL (targetIndex: 1)                                  -->
      <!-- Wyświetla: fotel_kraina po lewej, fotel_babcia po prawej   -->
      <!-- ========================================================== -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane src="#fotel_kraina" position="-1.2 0 -0.1" height="1" width="1"></a-plane>
        <a-plane src="#fotel_babcia" position="1.2 0 -0.1" height="1" width="1"></a-plane>
      </a-entity>

      <!-- ========================================================== -->
      <!-- 3. KREDENS (targetIndex: 2)                                -->
      <!-- Wyświetla: kredens_kraina po lewej, kredens_willa po prawej-->
      <!-- ========================================================== -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane src="#kredens_kraina" position="-1.2 0 -0.1" height="1" width="1"></a-plane>
        <a-plane src="#kredens_willa" position="1.2 0 -0.1" height="1" width="1"></a-plane>
      </a-entity>

      <!-- ========================================================== -->
      <!-- 4. KRZESŁO (targetIndex: 3)                                -->
      <!-- Wyświetla: krzeslo_willa po lewej, krzeslo_babcia po prawej-->
      <!-- ========================================================== -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane src="#krzeslo_willa" position="-1.2 0 -0.1" height="1" width="1"></a-plane>
        <a-plane src="#krzeslo_babcia" position="1.2 0 -0.1" height="1" width="1"></a-plane>
      </a-entity>

      <!-- ========================================================== -->
      <!-- 5. LAMPA (targetIndex: 4)                                  -->
      <!-- Wyświetla: lampa_willa po lewej, lampa_babcia po prawej    -->
      <!-- ========================================================== -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane src="#lampa_willa" position="-1.2 0 -0.1" height="1" width="1"></a-plane>
        <a-plane src="#lampa_babcia" position="1.2 0 -0.1" height="1" width="1"></a-plane>
      </a-entity>

      <!-- ========================================================== -->
      <!-- 6. STÓŁ (targetIndex: 5)                                   -->
      <!-- Wyświetla: stol_kraina po lewej, stol_babcia po prawej     -->
      <!-- ========================================================== -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-plane src="#stol_kraina" position="-1.2 0 -0.1" height="1" width="1"></a-plane>
        <a-plane src="#stol_babcia" position="1.2 0 -0.1" height="1" width="1"></a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
