<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<script>
  const galleries = {
    krzeslo: [
      "#krzeslo_willa",
      "#krzeslo_babcia",
      "#krzeslo_kraina"
    ],
    fotel: [
      "#fotel_willa",
      "#fotel_babcia",
      "#fotel_kraina"
    ]
  };

  let currentIndex = {
    krzeslo: 0,
    fotel: 0
  };

  function changeImage(type, direction) {
    const images = galleries[type];

    currentIndex[type] += direction;

    if (currentIndex[type] < 0) {
      currentIndex[type] = images.length - 1;
    }

    if (currentIndex[type] >= images.length) {
      currentIndex[type] = 0;
    }

    const plane = document.querySelector(`#${type}-image`);
    plane.setAttribute("src", images[currentIndex[type]]);
  }
</script>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>

  <a-assets>

    <!-- KRZESŁO -->
    <img id="krzeslo_willa" src="img/krzeslo_willa.jpg">
    <img id="krzeslo_babcia" src="img/krzeslo_babcia.jpg">
    <img id="krzeslo_kraina" src="img/krzeslo_kraina.jpg">

    <!-- FOTEL -->
    <img id="fotel_willa" src="img/fotel_willa.jpg">
    <img id="fotel_babcia" src="img/fotel_babcia.jpg">
    <img id="fotel_kraina" src="img/fotel_kraina.jpg">

  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- KRZESŁO -->
  <a-entity mindar-image-target="targetIndex: 1">

    <!-- GŁÓWNY OBRAZ -->
    <a-plane
      id="krzeslo-image"
      src="#krzeslo_willa"
      position="0 0 0"
      width="1"
      height="2">
    </a-plane>

    <!-- LEWA STRZAŁKA -->
    <a-text
      value="<"
      position="-0.9 0 0"
      scale="2 2 2"
      color="white"
      onclick="changeImage('krzeslo', -1)">
    </a-text>

    <!-- PRAWA STRZAŁKA -->
    <a-text
      value=">"
      position="0.9 0 0"
      scale="2 2 2"
      color="white"
      onclick="changeImage('krzeslo', 1)">
    </a-text>

  </a-entity>

  <!-- FOTEL -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- GŁÓWNY OBRAZ -->
    <a-plane
      id="fotel-image"
      src="#fotel_willa"
      position="0 0 0"
      width="1"
      height="2">
    </a-plane>

    <!-- LEWA STRZAŁKA -->
    <a-text
      value="<"
      position="-0.9 0 0"
      scale="2 2 2"
      color="white"
      onclick="changeImage('fotel', -1)">
    </a-text>

    <!-- PRAWA STRZAŁKA -->
    <a-text
      value=">"
      position="0.9 0 0"
      scale="2 2 2"
      color="white"
      onclick="changeImage('fotel', 1)">
    </a-text>

  </a-entity>

</a-scene>

</body>
</html>
